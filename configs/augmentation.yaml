geometric:
  rotation_step_degrees: 10
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  crop_scale_min: 0.7
  crop_p: 0.5

photometric:
  clahe_clip_min: 2.0
  clahe_clip_max: 4.0
  clahe_p: 0.5
  brightness_limit: 0.3
  contrast_limit: 0.3
  brightness_contrast_p: 0.8
  hue_shift_limit: 20
  sat_shift_limit: 30
  hue_sat_p: 0.5
  channel_shuffle_p: 0.3

noise_occlusion:
  gauss_var_min: 10
  gauss_var_max: 50
  gauss_p: 0.5
  dropout_max_holes: 8
  dropout_max_size: 32
  dropout_p: 0.4
  shadow_p: 0.3
  grid_distort_limit: 0.3
  grid_distort_p: 0.3
  grid_distort_p: 0.3
